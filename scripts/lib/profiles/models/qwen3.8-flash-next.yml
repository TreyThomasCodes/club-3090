    verify_glob: "Qwen3.8-Flash-Next-AD-4.27bpw-Q4_K_M-M64/*.gguf"
    manual_note: "🐣 community contribution — stock llama.cpp (the shared llama-cpp-local pin, b10920 ≥ the b10675 base where qwen4exp merged). The 38.4 GB n-gram table is shard 2 and stays SSD-paged under mmap — do NOT add --no-mmap (the Unsloth-specific pin; it would force all 94.5 GB resident); `-fit off` IS required (auto-fit mis-sizes this arch). Needs ~54.5 GB of fast memory + the table on a fast NVMe; publisher floor 24 GB GPU + 96 GB+ RAM. QUALITY UNTESTED family-wide — no 8-pack has run on this model on any engine."
  mmproj-f16:
    path: qwen3.8-flash-next-gguf/mmproj
    # ⚠️ REPO-ROOT artifact (sits beside the quant DIRECTORIES, not inside one), so
    # it lands flat in its own local_subdir and the glob carries no prefix.
    local_subdir: qwen3.8-flash-next-gguf/mmproj
    size_gb: 0.9
    format: gguf
    status: experimental
    hf_repo: unsloth/Qwen3.8-Flash-Next-GGUF
    kind: mmproj
    files:
      - mmproj-F16.gguf
    verify_glob: "*.gguf"
    manual_note: "Vision projector. ⚠️ `clip.projector_type = qwen3vl_merger` -> PROJECTOR_TYPE_QWEN3VL: there is NO PROJECTOR_TYPE_QWEN4EXP, vision works by REUSING the Qwen3VL path, so a future change there affects this model. Declares 27 deepstack layers. Validated 4/4 on ground truth 2026-08-29, both with the projector on CUDA0 and (since the default flip) on the HOST. ⭐ Shipped `-mmdev none`: the encoder costs ~1,114 MiB on CUDA0 and is allocated AFTER the moe-cache pool is sized, so nothing budgets for it — on-GPU placement left only 830 MiB headroom with a drafter active, a latent OOM on the first image request. Host placement costs ZERO cache slots."
  mmproj-f16-ac:
    path: qwen3.8-flash-next-gguf-ac/mmproj
    # REPO-ROOT artifact (beside the quant directory), landing flat in its
    # local_subdir — same shape as the Unsloth mmproj entry.
    local_subdir: qwen3.8-flash-next-gguf-ac/mmproj
    size_gb: 1
    format: gguf
    status: experimental
    hf_repo: AtomicChat/Qwen3.8-Flash-Next-GGUF
    kind: mmproj
    files:
      - mmproj-Qwen3.8-Flash-Next-F16.gguf
    verify_glob: "*.gguf"
    manual_note: "Vision projector for the AtomicChat builds (shared across all three of their quants). Same qwen3vl_merger projector family as the Unsloth one. The repo root also ships a BF16 variant (mmproj-Qwen3.8-Flash-Next-BF16.gguf); F16 is the catalog choice, matching the Unsloth side."
default_weight_variant: unsloth-ud-q4kxl

# ---------------------------------------------------------------------------
# setup.sh dispatch.
#   always_draft : ABSENT BY DESIGN — no drafter exists for this architecture.
#   vision       : opt-in via WITH_VISION=1. ⚠️ The shipped compose mounts the
#                  projector by default, so WITH_VISION=1 is effectively REQUIRED
#                  for a vision-capable boot; the entrypoint degrades to text-only
#                  rather than dying when the file is absent.
#   weights_aliases / alias_extras: the `gguf-ac` alias selects the AtomicChat
#                  AD-Q4_K_M build (its mmproj rides along as the extra). The
#                  default primary stays the Unsloth build — this alias is an
#                  alternate fetch, not a replacement.
# ---------------------------------------------------------------------------
setup:
  primary: unsloth-ud-q4kxl
  vision: mmproj-f16
  weights_aliases:
    gguf-ac: atomicchat-ad-q4km
  alias_extras:
    gguf-ac: [mmproj-f16-ac]
